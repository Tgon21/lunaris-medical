name: CI

# Lightweight validation for the static site on every PR/push to the long-lived
# branches. No build step (the site is plain HTML/CSS/JS served as-is).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate concept-1 site and assets exist
        run: |
          set -e
          test -f lunaris-1.html
          test -f brand/lunaris-logo.png
          test -f photos/office-sign.jpg
          echo "Required files present."

      - name: HTML well-formedness (non-blocking)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libxml2-utils >/dev/null 2>&1 || true
          if command -v xmllint >/dev/null; then
            xmllint --html --noout lunaris-1.html 2>&1 | head -20 || true
          fi
          echo "CI ok"
